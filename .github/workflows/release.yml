name: Publish release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  windows:
    name: Build and publish the Windows installer
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test importer and build CLI
        run: |
          dotnet run --project tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build cli/DiscordSnapshot.Cli.csproj -c Release
      - name: Install Inno Setup and build
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $inno = Join-Path $env:RUNNER_TEMP 'Inno Setup'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $setup
          $process = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$inno`"" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed with exit code $($process.ExitCode)." }
          ./installer/Build.ps1 -Compiler (Join-Path $inno 'ISCC.exe') -Version $env:GITHUB_REF_NAME.Substring(1)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = 'dist/APEX-Discord-Snapshot-Master-Setup-x64.exe'
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $installer --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $installer --verify-tag --generate-notes --title "APEX DSM $env:GITHUB_REF_NAME"
          }

  docker:
    name: Build and publish the viewer image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test viewer and build image
        run: |
          node --check web-ui/app.js
          python3 -B tests/viewer_auth.py
          docker compose config --quiet
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t apex-dsm-viewer ./web-ui
      - name: Smoke-test image
        run: |
          container=$(docker run -d -p 127.0.0.1:18080:8080 apex-dsm-viewer)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 1 http://127.0.0.1:18080/ |
            grep -F '<title>APEX DSM</title>'
      - name: Publish to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in "$GITHUB_REF_NAME" latest; do
            docker tag apex-dsm-viewer "$image:$tag"
            docker push "$image:$tag"
          done
      - name: Publish to Docker Hub when credentials are configured
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" && -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::notice::Docker Hub publishing is disabled. The image was published to GHCR."
            exit 0
          fi
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Configure both DOCKERHUB_USERNAME and DOCKERHUB_TOKEN."
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          image=$(docker compose config --images)
          for tag in "$GITHUB_REF_NAME" latest; do
            docker tag apex-dsm-viewer "${image%:latest}:$tag"
            docker push "${image%:latest}:$tag"
          done
